name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer: |
              build/package/*.deb
              build/package/*.rpm
              build/package/*.tar.gz
          - os: windows-2022
            installer: build/package/*.exe
          - os: macos-14
            installer: build/package/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  arch:
    # Native Arch Linux package against system Qt (packaging/arch/PKGBUILD).
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base qt6-declarative

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: .
          cd packaging/arch
          sudo -u builder makepkg --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    # Attach the installers to a GitHub release when a version tag (v*) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
