name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer: |
              build/package/*.deb
              build/package/*.rpm
              build/package/*.tar.gz
          - os: windows-2022
            installer: build/package/*.exe
          - os: macos-14
            installer: build/package/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  android:
    # APK for arm64-v8a, built with Qt for Android. Signed with the keystore from the
    # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets if set,
    # otherwise with a throw-away key (installable, but updates then need an uninstall).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/aucdatatool.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"
          else
            pass=ci-$GITHUB_RUN_ID; alias=aucdatatool
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AUCDataTool CI"
          fi
          echo "::add-mask::$pass"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$ks"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$alias"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$pass"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$pass"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build APK
        run: |
          cmake --build build --target apk --parallel
          mkdir -p build/package
          cp build/app/android-build/build/outputs/apk/release/*-signed.apk \
             build/package/AUCDataTool-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Android
          path: build/package/*.apk
          if-no-files-found: error

  arch:
    # Native Arch Linux package against system Qt (packaging/arch/PKGBUILD).
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base qt6-declarative

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: .
          cd packaging/arch
          sudo -u builder makepkg --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    # Attach the installers to a GitHub release when a version tag (v*) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
