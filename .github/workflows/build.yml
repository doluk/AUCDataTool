name: build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Qt for every package except Flatpak (KDE runtime) and Arch (system Qt).
  QT_VERSION: '6.12.1'
  # aqtinstall 3.3.0 (the latest release) cannot read Qt 6.12's Windows and Android
  # repositories; this master commit includes the fix (miurahr/aqtinstall#1048). Back to a
  # release (drop aqtsource) once one ships with it.
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            installer: build/package/*.exe
          - os: macos-15
            installer: build/package/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}
          # Qt Graphs (3D surface view) needs Qt Quick 3D and Shader Tools
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  linux:
    # .deb, .rpm and .tar.gz built on AlmaLinux 8 (glibc 2.28) so they also run on
    # RHEL/Rocky/Alma 8; the script checks the shipped binaries for newer glibc symbols.
    # Qt is built from source there (Qt's Linux binaries need glibc 2.34) and cached per
    # version and build script, so only the first run after a change takes an hour or more.
    runs-on: ubuntu-24.04
    container: almalinux:8
    steps:
      - uses: actions/checkout@v4

      - name: Cache tools
        run: dnf -y -q install tar gzip zstd

      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/qt-el8
          key: qt-el8-${{ env.QT_VERSION }}-${{ hashFiles('packaging/linux/build-qt-el8.sh') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: bash packaging/linux/build-el8.sh qt

      - name: Save Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/qt-el8
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Build, test and package
        run: bash packaging/linux/build-el8.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Linux
          path: |
            build-el8/package/*.deb
            build-el8/package/*.rpm
            build-el8/package/*.tar.gz
          if-no-files-found: error

  flatpak:
    # Flatpak bundle against the KDE runtime (packaging/flatpak). Installs with
    # `flatpak install AUCDataTool-x86_64.flatpak`; the runtime comes from Flathub.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net app/linux/io.github.doluk.AUCDataTool.metainfo.xml

      # A user installation of the KDE SDK: updating the image's system installation fails
      # on the runner's overlay file system ("Invalid cross-device link").
      - name: Build bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean             --repo=repo build-flatpak packaging/flatpak/io.github.doluk.AUCDataTool.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo             repo AUCDataTool-x86_64.flatpak io.github.doluk.AUCDataTool

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Flatpak
          path: AUCDataTool-x86_64.flatpak
          if-no-files-found: error

  android:
    # APK for arm64-v8a, built with Qt for Android. Signed with the keystore from the
    # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets if set,
    # otherwise with a throw-away key (installable, but updates then need an uninstall).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The NDK Qt for Android was built with (r27c for Qt 6.12).
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Desktop Qt provides the host tools (moc, qsb, androiddeployqt); installed first so
      # that QT_ROOT_DIR ends up pointing at Qt for Android.
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true
          cache-key-prefix: qt-android-host

      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: all_os  # Qt >= 6.7 publishes Android packages under all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/aucdatatool.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"
          else
            pass=ci-$GITHUB_RUN_ID; alias=aucdatatool
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AUCDataTool CI"
          fi
          echo "::add-mask::$pass"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$ks"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$alias"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$pass"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$pass"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build APK
        run: |
          cmake --build build --target apk --parallel
          mkdir -p build/package
          cp build/app/android-build/build/outputs/apk/release/*-signed.apk \
             build/package/AUCDataTool-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Android
          path: build/package/*.apk
          if-no-files-found: error

  arch:
    # Native Arch Linux package against system Qt (packaging/arch/PKGBUILD).
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base qt6-declarative qt6-graphs qt6-quick3d qt6-wayland

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: .
          cd packaging/arch
          sudo -u builder makepkg --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AUCDataTool-Arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    # Attach the installers to a GitHub release when a version tag (v*) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, flatpak, android, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
